name: Verify plugin catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify package catalog and metadata
        run: node scripts/verify-catalog.mjs
      - name: Run package behavior and DSH schema tests
        run: npm test
      - name: Syntax-check plugin entry points
        shell: bash
        run: |
          while IFS= read -r file; do node --check "$file"; done < <(find packages -mindepth 2 -maxdepth 2 -name index.js -print | sort)
